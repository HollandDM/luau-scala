name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # The wasm tasks invoke /usr/bin/clang{,++} and pin the sysroot sources
      # to wasi-sdk-31 (LLVM 22) — keep the clang major matched to that tag.
      - name: Install LLVM 22 + cmake + ninja
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y cmake ninja-build
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-22 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-22 100
      - name: Cache Mill + Coursier
        uses: actions/cache@v4
        with:
          path: |
            ~/.mill
            ~/.cache/coursier
          key: mill-${{ hashFiles('.mill-version', 'build.mill') }}
      # The ~10-minute wasi sysroot build reruns only when its task code
      # changes; cache the task output (and its journal) keyed on build.mill.
      - name: Cache WASI sysroot
        uses: actions/cache@v4
        with:
          path: |
            out/shim/wasiSysroot.dest
            out/shim/wasiSysroot.json
          key: wasi-sysroot-${{ hashFiles('build.mill') }}
      - name: Compile all Scala modules
        run: ./mill-launcher.sh __.compile
      - name: Run Panama tests
        run: ./mill-launcher.sh panama.test
      - name: Run Scala.js WASM tests
        run: ./mill-launcher.sh wasm.test
      - name: Run all tests
        run: ./mill-launcher.sh __.test
