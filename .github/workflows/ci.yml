name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install clang++
        run: sudo apt-get update -qq && sudo apt-get install -y clang-17 llvm-17 && sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-17 100
      - name: Install emsdk
        run: |
          git clone https://github.com/emscripten-core/emsdk.git /tmp/emsdk
          /tmp/emsdk/emsdk install 3.1.50
          /tmp/emsdk/emsdk activate 3.1.50
          echo "/tmp/emsdk:/tmp/emsdk/upstream/emscripten" >> $GITHUB_PATH
          echo "EMSDK=/tmp/emsdk" >> $GITHUB_ENV
      - name: Cache Mill + Coursier
        uses: actions/cache@v4
        with:
          path: ~/.mill;~/.cache/coursier
          key: mill-${{ hashFiles('.mill-version', 'build.mill') }}
      - name: Download Mill
        run: curl -L https://github.com/com-lihaoyi/mill/releases/download/0.12.3/mill -o ./mill && chmod +x ./mill
      - name: Compile all Scala modules
        run: ./mill __.compile
      - name: Build native shim
        run: ./mill shim.nativeBuild
      - name: Build WASM shim
        run: source /tmp/emsdk/emsdk_env.sh && ./mill shim.wasmBuild
      - name: Copy WASM to test resources
        run: ./mill shim.copyWasmToResources
      - name: Run Panama smoke tests
        run: ./mill panama.test
      - name: Run Scala.js tests
        run: ./mill wasm.test
      - name: Run all other tests
        run: ./mill __.test
